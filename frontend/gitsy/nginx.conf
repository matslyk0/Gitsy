events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  proxy_connect_timeout 10s;
  proxy_send_timeout 5s;
  proxy_read_timeout 10s;
  send_timeout 10s;

  server {
    listen 80;
    server_name gitsy.co.uk www.gitsy.co.uk;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri = 404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }  

  server {
    listen 443 ssl http2;
    server_name gitsy.co.uk www.gitsy.co.uk;

    ssl_certificate /etc/letsencrypt/live/gitsy.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitsy.co.uk/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }

    location /api/ {
      proxy_pass http://backend:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout 5s;
      proxy_read_timeout 330s;
      send_timeout 10s;
    }
  }
}
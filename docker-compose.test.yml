services:

  test-database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data


  redis-test-db:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-test-data:/var/lib/redis/data


volumes:
  redis-test-data:
  postgres-test-data:
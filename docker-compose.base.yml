services:

  backend:
    build: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python run.py


  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin


volumes:
  pgadmin-data:
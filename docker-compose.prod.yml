services:

  frontend:
    image: 764475167282.dkr.ecr.eu-north-1.amazonaws.com/gitsy-frontend:latest
    ports:
      - "5173:80"

  backend:
    image: 764475167282.dkr.ecr.eu-north-1.amazonaws.com/gitsy-backend:latest
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${{ secrets.POSTGRES_PROD_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PROD_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_PROD_DB }}
      GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${{ secrets.POSTGRES_PROD_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PROD_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_PROD_DB }}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-db:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis/data

volumes:
  postgres-data:
  redis-data:

services:

  frontend:
    image: 764475167282.dkr.ecr.eu-north-1.amazonaws.com/gitsy-frontend:latest
    ports:
      - "5173:80"

  backend:
    image: 764475167282.dkr.ecr.eu-north-1.amazonaws.com/gitsy-backend:latest
    environment:
      POSTGRES_USER: $${{ secrets.POSTGRES_PROD_USER }}
      POSTGRES_PASSWORD: $${{ secrets.POSTGRES_PROD_PASSWORD }}
      POSTGRES_DB: $${{ secrets.POSTGRES_PROD_DB }}
      GIT_HUB_TOKEN: $${{ secrets.GIT_HUB_TOKEN }}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: $${{ secrets.POSTGRES_PROD_USER }}
      POSTGRES_PASSWORD: $${{ secrets.POSTGRES_PROD_PASSWORD }}
      POSTGRES_DB: $${{ secrets.POSTGRES_PROD_DB }}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${{ secrets.POSTGRES_PROD_USER }} -d $${{ secrets.POSTGRES_PROD_DB }}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-db:
    image: redis:latest
    volumes:
      - redis-data:/var/lib/redis/data

volumes:
  postgres-data:
  redis-data:
